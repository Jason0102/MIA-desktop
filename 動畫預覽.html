<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>米亞動畫預覽</title>
<style>body{margin:0;font:16px system-ui;background:#eef0f4}nav{padding:12px;display:flex;gap:12px}button{padding:10px 18px;font:inherit;cursor:pointer}button[aria-selected=true]{background:#343b4a;color:white}iframe{border:0;width:100%;height:calc(100vh - 68px)}</style>
<nav aria-label="動畫類別"><button id="emotion" aria-selected="true">說話與情緒 · 語音試聽</button><button id="original" aria-selected="false">動作與生活動畫</button></nav>
<iframe id="preview" title="動畫預覽內容" src="情緒動畫預覽.html"></iframe>
<script>
const preview=document.getElementById('preview');
function select(emotions,hash=''){
 document.getElementById('emotion').setAttribute('aria-selected',emotions);
 document.getElementById('original').setAttribute('aria-selected',!emotions);
 preview.src=(emotions?'情緒動畫預覽.html':'art/v39-timed/index.html')+hash;
}
document.getElementById('emotion').onclick=()=>select(true);
document.getElementById('original').onclick=()=>select(false);
window.addEventListener('message',e=>{if(e.source===preview.contentWindow&&e.data==='mia-preview-default')select(true,'#EMO-000')});
</script></html>
