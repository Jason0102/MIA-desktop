let active=null;
function stopAudio(){if(active){active.audio.pause();active.button.textContent='語音試聽';active.card.style.outline='';active=null}}
window.addEventListener('pagehide',stopAudio);
function addAudio(card,p){
 const sample=samples.find(s=>s.code===p.code),line=document.createElement('p'),button=document.createElement('button');
 line.textContent=sample.line;button.textContent='語音試聽';
 button.onclick=async()=>{
  const same=active?.button===button;stopAudio();if(same)return;
  const audio=new Audio('art/speech-audio/'+p.code+'.mp3');
  active={audio,button,card};button.textContent='載入中…';
  audio.onplaying=()=>{if(active?.audio===audio){button.textContent='停止試聽';card.style.outline='3px solid #b58a37'}};
  audio.onended=()=>{if(active?.audio===audio)stopAudio()};
  audio.onerror=()=>{if(active?.audio===audio){stopAudio();button.textContent='音檔載入失敗，點擊重試'}};
  try{await audio.play()}catch{if(active?.audio===audio){stopAudio();button.textContent='無法播放，點擊重試'}}
 };card.append(line,button);
}
let running=true,elapsed=0,last=performance.now();const cards=[];
toggle.onclick=()=>{stopAudio();running=!running;toggle.textContent=running?'暫停':'播放'};
const indexRows = new Map();
for (const p of [...profiles].sort((a,b)=>a.code.localeCompare(b.code))) {
 const row=document.createElement('li'),link=document.createElement('a');
 link.href='#'+p.code;link.textContent=p.code+' · '+p.tag;
 row.append(link);document.getElementById('index').append(row);indexRows.set(p.code,row);
}
function matches(p){return (p.code+' '+p.tag).toLowerCase().includes(filter.value.trim().toLowerCase())}
filter.oninput=()=>{
 stopAudio();
 for(const p of profiles)indexRows.get(p.code).hidden=!matches(p);
 for(const c of cards)c.card.hidden=!matches(c.p);
};
function load(file){return new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=reject;image.src=base+file})}
function frame(image,cell,atlas){
 const col=cell%atlas.columns,row=Math.floor(cell/atlas.columns),x=atlas.xBounds[col],y=atlas.yBounds[row];
 const w=atlas.xBounds[col+1]-x,h=atlas.yBounds[row+1]-y;
 const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.drawImage(image,x,y,w,h,0,0,w,h);
 const [left,top,endX,endY]=atlas.bounds[cell],right=endX-1,bottom=endY-1;
 const out=document.createElement('canvas');out.width=768;out.height=832;
 const cw=right-left+1,ch=bottom-top+1,s=Math.min(680/cw,780/ch);
 out.getContext('2d').drawImage(c,left,top,cw,ch,(768-cw*s)/2,812-ch*s,cw*s,ch*s);return out;
}
async function setup(){for(const atlas of atlases){const image=await load(atlas.file);for(let index=0;index<atlas.tags.length;index++){
 const p=profiles.find(p=>p.tag===atlas.tags[index]);const card=document.createElement('article');const canvas=document.createElement('canvas');canvas.width=384;canvas.height=416;
 const label=document.createElement('p');label.textContent=p.code+' · '+p.tag;
 card.id=p.code;card.hidden=!matches(p);card.append(canvas,label);addAudio(card,p);gallery.append(card);
 cards.push({card,canvas,p,frames:[frame(image,index*2,atlas),frame(image,index*2+1,atlas)]});
 }}
 const p=profiles.find(p=>p.code==='EMO-000');
 const card=document.createElement('article'),canvas=document.createElement('canvas');canvas.width=384;canvas.height=416;
 const label=document.createElement('p');label.textContent='EMO-000 · 預設說話';
 card.id=p.code;card.append(canvas,label);addAudio(card,p);gallery.prepend(card);
 cards.push({card,canvas,p,frames:[await load('speaking.png'),await load('listening.png')]});
 if(location.hash)document.getElementById(location.hash.slice(1))?.scrollIntoView();
 requestAnimationFrame(tick)}
function tick(now){if(running)elapsed+=(now-last)/1000;last=now;
 for(const c of cards){if(c.card.hidden)continue;const time=active?(active.card===c.card?active.audio.currentTime:0):elapsed;const g=c.canvas.getContext('2d');g.clearRect(0,0,384,416);g.save();const phase=time/c.p.period*Math.PI*2;
 g.translate(192,416*.94);g.rotate((c.p.lean+Math.sin(phase)*c.p.tilt)*Math.PI/180);g.scale(1,1+Math.sin(phase)*c.p.breath);g.translate(-192,-416*.94);
 g.drawImage(c.frames[Math.floor(time*2)%2],0,0,384,416);g.restore();}requestAnimationFrame(tick)}
setup().catch(e=>gallery.textContent='素材載入失敗，請從 MIA_desktop 資料夾開啟預覽。');
</script></html>
